name: Daily paper trade

on:
  schedule:
    # 21:30 UTC is after the 4pm New York close all year (5:30pm EDT / 4:30pm EST).
    - cron: "30 21 * * 1-5"
    # Sunday evening: re-decide with weekend news before Monday's open.
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papertrader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m papertrader -v run
      - name: Commit results
        run: |
          git config user.name "papertrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data REPORT.md docs
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Daily run $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
