name: Strategy research

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of price history"
        default: "10"
  schedule:
    - cron: "17 12 1 * *"  # monthly refresh

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward comparison of price-only strategies
        run: |
          python -m papertrader research --years "${{ github.event.inputs.years || '10' }}"
          cat research/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "papertrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Research results $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
