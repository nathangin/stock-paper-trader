name: Smart money (13F)

# Refresh what top funds hold from their quarterly SEC 13F filings, update the
# smart_money account's picks, and re-run the copy-the-funds backtest. Filings
# and ticker lookups are cached in data/smart_money, so reruns only fetch new ones.
on:
  schedule:
    - cron: "41 13 * * 6"  # Saturdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-money
  cancel-in-progress: false

jobs:
  smart-money:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Fetch 13F filings, pick stocks, backtest
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python -m papertrader -v smart-money
          cat research/SMART_MONEY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "papertrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smart_money research
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Smart money update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
